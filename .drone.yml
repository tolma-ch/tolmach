kind: pipeline
type: docker
name: Build Tolma.ch

steps:
- name: build and publish
  image: plugins/docker
  settings:
    repo: registry.venya.tech/tolmach-web/tolmach
    registry: https://registry.venya.tech/
    tags: [ "${DRONE_TAG}","latest" ]
    username:
      from_secret: docker_username
    password:
      from_secret: docker_password

trigger:
  event:
    - tag