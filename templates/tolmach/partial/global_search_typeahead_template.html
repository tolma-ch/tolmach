<script type="text/ng-template" id="globalSearchTypeaheadTemplate.html">
    <div class="custom-popup-wrapper"
         ng-style="{top: position().top+'px', left: position().left+'px'}"
         style="display: block;"
         ng-show="isOpen() && !moveInProgress"
         aria-hidden="{=!isOpen()=}">
        <p class="message">this document</p>

        <ul class="dropdown-menu" role="listbox">
            <li class="uib-typeahead-match" ng-repeat="match in matches track by $index" ng-class="{active: isActive($index) }"
                ng-mouseenter="selectActive($index)" ng-click="selectMatch($index)" role="option" id="{=match.id=}" ng-if="match.model.block === 'document'">
{#                <div uib-typeahead-match index="$index" match="match" query="query" template-url="templateUrl">#}
                <a class="search-result">
                    <div class="search-result__icon">
                        <i aria-hidden="true"
                           ng-class="{'fa fa-align-center': (match.model.type == 'fragment'),
                                      'fa fa-user': (match.model.type == 'user')}"></i>
                    </div>
                    <div class="search-result__text">
                        <span class="search-result__text__main" ng-bind-html="match.model.searched_text | uibTypeaheadHighlight:query"></span>
                        <span class="search-result__text__parent" ng-bind-html="match.model.parent_text | uibTypeaheadHighlight:query"></span>
                        <span class="search-result__text__additional_data" ng-if="match.model.type == 'fragment'">
                            <i class="fa fa-file-text-o" aria-hidden="true"></i><span ng-bind-html="match.model.additional_data.page | uibTypeaheadHighlight:query"></span>
                            <i class="fa fa-align-center" aria-hidden="true"></i><span ng-bind-html="match.model.additional_data.fragment | uibTypeaheadHighlight:query"></span>
                        </span>
                    </div>
                </a>
{#                </div>#}
            </li>
        </ul>
        <p class="message">this project</p>
        <ul class="dropdown-menu" role="listbox">
            <li class="uib-typeahead-match" ng-repeat="match in matches track by $index" ng-class="{active: isActive($index) }"
                ng-mouseenter="selectActive($index)" ng-click="selectMatch($index)" role="option" id="{=match.id=}" ng-if="match.model.block === 'project'">
{#                <div uib-typeahead-match index="$index" match="match" query="query" template-url="templateUrl">#}
                <a class="search-result">
                    <div class="search-result__icon">
                        <i aria-hidden="true"
                           ng-class="{'fa fa-align-center': (match.model.type == 'fragment'),
                                      'fa fa-user': (match.model.type == 'user')}"></i>
                    </div>
                    <div class="search-result__text">
                        <span class="search-result__text__main" ng-bind-html="match.model.searched_text | uibTypeaheadHighlight:query"></span>
                        <span class="search-result__text__parent" ng-bind-html="match.model.parent_text | uibTypeaheadHighlight:query"></span>
                        <span class="search-result__text__additional_data" ng-if="match.model.type == 'fragment'">
                            <i class="fa fa-file-text-o" aria-hidden="true"></i><span ng-bind-html="match.model.additional_data.page | uibTypeaheadHighlight:query"></span>
                            <i class="fa fa-align-center" aria-hidden="true"></i><span ng-bind-html="match.model.additional_data.fragment | uibTypeaheadHighlight:query"></span>
                            <i class="fa fa-align-center" aria-hidden="true"></i><span ng-bind-html="match.model.additional_data.document_name | uibTypeaheadHighlight:query"></span>
                        </span>
                    </div>
                </a>
{#                </div>#}
            </li>
        </ul>
    </div>
</script>
