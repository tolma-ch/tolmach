{% load i18n %}
<script type="text/ng-template" id="addOrgParticipantModal.html">
    <div class="modal-header">
        <button type="button"
                class="bootbox-close-button close"
                ng-click="cancel()">×</button>
        <h3 class="modal-title">{% trans "Invite organization participant" %}</h3>
    </div>
    <div class="modal-body">
        <div class="participant-invite-link" style="margin-bottom: 20px;">
            <span>
                {% trans "Invite users from all over the world via link:" %}
            </span>
            <div class="input-group">
                <span class="input-group-btn">
                    <button class="btn btn-sm btn-default"
                            type="button"
                            ng-click="updateInviteCode()">
                        <i class="fa fa-refresh" aria-hidden="true"></i>
                    </button>
                </span>
                <input class="form-control" type="text" id="form-field-mask-3" readonly="true" value="{{ base_domain }}/org/i/{= orgInviteCode =}/">
                <span class="input-group-btn">
                    <button class="btn btn-sm btn-default"
                            type="button"
                            ng-click-copy="{{ base_domain }}/org/i/{= orgInviteCode =}/">
                        <i class="fa fa-clipboard" aria-hidden="true"></i>
                    </button>
                </span>
            </div>
        </div>
        <span>
            {% trans "or find one among the users of Tolma.ch:" %}
        </span>
        <form>
            <div class="form-group">
                <input type="text"
                       autocomplete="off"
                       id="form-field-1"
                       placeholder="{% trans "Enter nick or name" %}"
                       class="form-control"
                       ng-model="user"
                       uib-typeahead="user as user.username for user in getUsers($viewValue)"
                       typeahead-template-url="userTypeaheadTemplate.html"></div>

            <div class="form-group" ng-show="error">
                <div class="label label-danger">{= error =}</div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button class="btn btn-success"
                ng-click="ok()"
                ng-disabled="busy">{% trans "Invite" %}</button>
    </div>
</script>
