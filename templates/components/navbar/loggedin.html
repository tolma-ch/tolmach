{% load i18n %}
{% load dajaxice_templatetags %}{% dajaxice_js_import %}
<script type="text/javascript">
function invite(data){
    if(data!=Dajaxice.EXCEPTION){
        alert(data.message);
    }else{
        alert('Error');
    }
}
</script>
<ul class="navbar-nav pull-right">
	<li class="navbar-nav__button button_gray">
		<a data-toggle="dropdown" class="dropdown-toggle" href="#">
			<i class="icon-tasks"></i>
			<span class="badge badge-grey">4</span>
		</a>
	</li>

	<li class="navbar-nav__button button_purple">
		<a data-toggle="dropdown" class="dropdown-toggle" href="#">
            {% if invites_num > 0 %}
			<i class="icon-bell-alt icon-animated-bell"></i>
			<span class="badge badge-important">{{ invites_num }}</span>
            {% else %}
            <i class="icon-bell-alt"></i>
            {% endif %}
		</a>
	</li>

	<li class="navbar-nav__button button_dark-green">
		<a data-toggle="dropdown" class="dropdown-toggle" href="#">
			<i class="icon-envelope icon-animated-vertical"></i>
			<span class="badge badge-success">5</span>
		</a>
	</li>

	<li class="navbar-nav__button button_light-blue navbar-nav__user">
		<a data-toggle="dropdown" href="#" class="dropdown-toggle">
			<img class="navbar-nav__user-photo" src="/media/avatars/user.jpg" alt="Jason's Photo">
			<span class="navbar-nav__user-info">
				<small>{% trans "Hi," %}</small>
				<span>{{ username }}</span>
			</span>

			<i class="icon-caret-down"></i>
		</a>
	</li>
</ul>
