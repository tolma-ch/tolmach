      <form action="/dev-add-glossary/" enctype="multipart/form-data" method="POST">
          {% csrf_token %}
          <div class="form-group">
              <label class="control-label">Field Name</label>
              <div class="controls">

              </div>
          </div>
        <div class="form-group">
          <label class="control-label">File name</label>
          <div class="controls">
            <input class="form-control" type="file" name="f">
          </div>
          <button class="btn pull-right btn-primary">Parse glossary</button>
        </div>
      </form>
    </div>
  <h2>{{ name }}</h2>
