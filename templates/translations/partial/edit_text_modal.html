{% load i18n %}
<script type="text/ng-template" id="editTextModal.html">
    <div class="modal-header">
        <button type="button"
                class="bootbox-close-button close"
                ng-click="cancel()">×</button>
        <h3 class="modal-title">{% trans "Edit text" %}</h3>
    </div>
    <div class="modal-body">
        <form>
            <div class="form-group">
                <input type="text"
                       placeholder="{% trans "Title" %}"
                       class="form-control"
                       ng-model="text.title">
            </div>
            <div class="form-group" style="display: none;">
                <select class="form-control"
                        ng-model="text.subject">
                    <option value="" disabled selected>Select subject</option>
                    {% for subject in subjects %}
                        <option value="{{ subject.id }}">{{ subject.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="glossary-manual ng-scope">
                <div class="glossary-manual__input">
                    <label for="">Glossaries:</label>
                    <div ng-repeat="glossary in glossaries">
                        <label class="middle" for="">
                            <input class="ace"
                                   type="checkbox"
                                   ng-click="toggleGlossary(glossary.id)"
                                   ng-checked="text.glossaries.indexOf(glossary.id) > -1"/>
                            <span class="lbl">
                                {= glossary.name =}
                            </span>
                        </label>
                    </div>
                </div>
                <div class="glossary-manual__input">
                    <label for="">TMXes:</label>
                    <div ng-repeat="tmx in tmxes">
                        <label class="middle" for="">
                            <input class="ace"
                                   type="checkbox"
                                   ng-click="toggleTmx(tmx.id)"
                                   ng-checked="text.tmxes.indexOf(tmx.id) > -1"/>
                            <span class="lbl">
                                {= tmx.name =}
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group" ng-show="error">
                <div class="label label-danger">{= error =}</div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button class="btn btn-success"
                ng-click="ok()"
                ng-disabled="busy">{% trans "Save" %}</button>
    </div>
</script>
