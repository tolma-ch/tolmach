{% load i18n %}
<script type="text/ng-template" id="editTextModal.html">
    <div class="modal-header">
        <button type="button"
                class="bootbox-close-button close"
                ng-click="cancel()">×</button>
        <h3 class="modal-title">{% trans "Edit text" %}</h3>
    </div>
    <div class="modal-body">
        <form>
            <div class="form-group">
                <input type="text"
                       placeholder="{% trans 'Title' %}"
                       class="form-control"
                       ng-model="text.title">
            </div>
            <div class="form-group">
                <label class="middle" for="machineTransInput">
                    <input class="ace"
                           type="checkbox"
                           id="machineTransInput"
                           ng-model="text.machine"/>
                    <span class="lbl grey">
                        {% trans "Enable machine translation" %}
                    </span>
                </label>
            </div>
            <div class="form-group" style="display: none;">
                <select class="form-control"
                        ng-model="text.subject">
                    <option value="" disabled selected>Select subject</option>
                    {% for subject in subjects %}
                        <option value="{{ subject.id }}">{{ subject.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" ng-show="error">
                <div class="label label-danger">{= error =}</div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button class="btn btn-warning pull-left"
                ng-click="remove()"
                ng-disabled="busy">{% trans "Delete text" %}</button>
        <button class="btn btn-success"
                ng-click="ok()"
                ng-disabled="busy">{% trans "Save" %}</button>
    </div>
</script>
