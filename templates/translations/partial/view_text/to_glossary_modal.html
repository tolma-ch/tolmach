{% load i18n %}
<script type="text/ng-template" id="toGlossaryModal.html">
    <div class="modal-header">
        <button type="button"
                class="bootbox-close-button close"
                ng-click="cancel()">×</button>
        <h3 class="modal-title"
            ng-show="!glossary.id">{% trans "Add glossary" %}</h3>
        <h3 class="modal-title"
            ng-show="glossary.id">{% trans "Edit glossary" %}</h3>
    </div>
    <div class="modal-body">
        <form>
            <div>
                <div class="glossary-manual">
                    <div class="glossary-manual__input">
                        <input class="form-control" type="text"
                               ng-model="glossary.rows[0][0]"/>
                    </div>
                    <div class="glossary-manual__arrow">
                        <label for="exampleInputName2">→</label>
                    </div>
                    <div class="glossary-manual__input">
                        <input class="form-control" type="text"
                               ng-model="glossary.rows[0][1]"
                        autofocus />
                    </div>
                </div>
            </div>

            <div class="form-group" ng-show="error">
                <div class="label label-danger">{= error =}</div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button class="btn btn-success"
                ng-click="ok()"
                ng-disabled="busy">
            <span ng-show="!glossary.id">{% trans "Add" %}</span>
            <span ng-show="glossary.id">{% trans "Save" %}</span>
        </button>
    </div>
</script>
