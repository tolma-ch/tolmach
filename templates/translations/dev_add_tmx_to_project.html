<!doctype html>

<html>
  
  <head>
    <title>Add TMX to project</title>
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.0.3/jquery.min.js" type="text/javascript"></script>
    <script src="https://netdna.bootstrapcdn.com/bootstrap/3.1.1/js/bootstrap.min.js" type="text/javascript"></script>
  </head>
  
  <body>
  <br>
  <br>
  <br>
    <div class="container">
      <form method="POST" action="/projects/add-tmx/">
          {% csrf_token %}
          <div class="form-group">
            <label class="control-label">TMX name</label>
            <div class="controls">
              <input class="form-control" type="text" name="tmdb-name">
            </div>
          </div>
          <select class="form-control" name="project-id">
          {% for project in projects %}
            <option value="{{ project.id }}">{{ project.name }}</option>
          {% endfor %}
          </select>
          <br>
          <button class="btn btn-primary">Add tmx!</button>
      </form>
    </div>
  </body>

</html>
