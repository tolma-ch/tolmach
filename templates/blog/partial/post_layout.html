{% block post_layout %}
<div class="blog-post{% if not post.published %} not-published{% endif %}">
    <h3 class="post-header">
        <a href="{{ post.url }}">{{ post.title }}</a>
    </h3>
    <p class="post-date">
        {{ post.date }}
    </p>
    <div class="text-left">
        {{ post.formatted_content|safe }}
    </div>
    <div class="ya-share2"
         data-services="vkontakte,facebook,twitter"
         data-url="{{ base_domain }}{{ post.url }}"
         data-title="Tolma.ch: {{ post.title }}"
         data-description="{{ post.clean_content|safe }}">
    </div>
    {% if user.is_staff %}<br><br><p><a href="/admin/blog/post/{{ post.id }}/change">Edit</a></p>{% endif %}
    <hr style="height:30px">
</div>
{% endblock %}
