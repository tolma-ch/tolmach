{% block post_layout %}
<div class="blog-post">
    <h3 class="post-header">
        <a href="{{ post.url }}">{{ post.title }}</a>
    </h3>
    <p class="post-date">
        {{ post.date }}
    </p>
    <div class="text-left">
        {{ post.formatted_content|safe }}
    </div>
    <div class="ya-share2"
         data-services="vkontakte,facebook,twitter"
         data-url="{{ base_domain }}{{ post.url }}"
         data-title="Tolma.ch: {{ post.title }}"
         data-description="{{ post.formatted_content|safe }}">
    </div>
    <hr style="height:30px">
</div>
{% endblock %}
