        <div class="help" ng-show="helpShow" resize="helpResize">
            <div class="help__fadeout-block" ng-style="helpBlockStyle1">
                <div class="help__btns">
                    <a class="btn btn-danger help__btn"
                       ng-click="closeHelpPresentation()">{% trans "Close" %}</a>
                    <a class="btn btn-success help__btn"
                       ng-click="nextHelpStep()"
                       ng-show="hasNext">{% trans "Next" %}</a>
                </div>
                <div class="help__text-block" ng-style="helpTextStyle1">{= helpText =}</div>
            </div>
            <div class="help__fadeout-block" ng-style="helpBlockStyle2"></div>
            <div class="help__fadeout-block" ng-style="helpBlockStyle3"></div>
            <div class="help__fadeout-block" ng-style="helpBlockStyle4">
            </div>
            <div class="help__transparent-block" ng-style="helpCenterBlockStyle1" ng-click="clickBlock()"></div>
        </div>

        <div class="popover fade bottom in"
             id="translation-popup"
             ng-show="showTranslatePopup"
             ng-style="translatePopupStyle">
            <div class="arrow"></div>
            <div class="popover-content">
                <div ng-repeat="res in translationResults">
                    <a href="" ng-click="copyToClipboard(res)">{= res =}</a>

                </div>
            </div>
        </div>
