{% load i18n %}
		<header class="navbar navbar-default" id="navbar">
			<script type="text/javascript">
				try{ace.settings.check('navbar' , 'fixed')}catch(e){}
			</script>

			<div class="navbar-container" id="navbar-container">
				<div class="navbar-header pull-left">
                    <a href="/">
                        <!--<img src="/static/tolma.ch.ru_small_white.png" style="margin-top:3px">-->
                        <!--<img src="/static/img/tolmach_1-02_mini.png">-->
                        <img src="/static/img/top-logo.svg">
                    </a><!-- /.brand -->
				</div><!-- /.navbar-header -->


				{% if user.is_authenticated %}
	                {% load tolmach_tags %}
	                {% login_navbar %}
                    <ul class="breadcrumbs2 hidden-xs">
                        {% for link in breadcrumbs %}
                        <li class="breadcrumbs2__item">
                            {% if link.1 %}<a href="{{ link.1 }}">{{ link.0 }}</a>
                            {% else %}{{ link.0 }}
                            {% endif %}
                        </li>
                        {% endfor %}

                        {% if text and target_lang %}
                            <a class="breadcrumbs2__btn"
                               href="/text/{{ text.id }}/{{ target_lang }}/export/"
                               tooltip="{% trans 'Export translation' %}"
                               tooltip-placement="bottom"
                               tooltip-append-to-body="true"><i class="fa fa-download"></i></a>
                        {% endif %}
                    </ul>


	            {% else %}
				<!--<ul class="navbar-nav pull-right">-->
					<!--<li class="navbar-nav__button button_blue">-->
						<!--<a href="#">BLOG</a>-->
					<!--</li>-->
					<!--<li class="navbar-nav__button button_green">-->
						<!--<a href="#">CONTACTS</a>-->
					<!--</li>-->
				<!--</ul>-->
				{% endif %}
			</div><!-- /.container -->
		</header>
