image: python:2.7.13
pipelines:
  branches:
    dev:
      - step:
        caches:
          - pip
        script:
          - pip install ansible==2.6
          - git clone git@bitbucket.org:megavenik/tolmach-ansible.git
          - cd tolmach-ansible
            - ansible-playbook -i inventory/hosts -i hosts/staging site.yml --tags="deploy" --skip-tags="dbcreate" --private-key /opt/atlassian/pipelines/agent/data/id_rsa site.yml
definitions:
  caches:
    pip: ~/.cache/pip